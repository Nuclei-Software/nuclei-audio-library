## Package Base Information
name: app-nuclei_audio-evs
owner: nuclei
version: 0.1.0
description: EVS (Enhanced Voice Services) Codec
type: app
keywords:
  - evs
  - codec
category: audio application
license: Apache-2.0
homepage: https://github.com/Nuclei-Software/nuclei-audio-library/tree/master/EVS

## Package Dependency
dependencies:
  - name: sdk-nuclei_sdk
    version:
## Package Configurations
configuration:
setconfig:
  - config: stdclib
    value: newlib_small
  - config: download_mode
    value: ddr
  - config: nuclei_core
    value: n900
  - config: nuclei_archext
    value: _zba_zbb_zbc_zbs_zicond_zilsd_xxldspn3x
## Source Code Management
codemanage:
  copyfiles:
    - path:
        - "*.c"
        - "*.h"
        - "src/c-code/basic_math"
        - "src/c-code/basic_op"
        - "src/c-code/lib_com"
        - "src/c-code/lib_dec"
        - "src/c-code/lib_enc"
        - "data/*.c"
        - "data/*.h"
  incdirs:
    - path:
        - "./"
        - "src/c-code/basic_math"
        - "src/c-code/basic_op"
        - "src/c-code/lib_com"
        - "src/c-code/lib_dec"
        - "src/c-code/lib_enc"
  libdirs:
  ldlibs:

## Build Configuration
buildconfig:
  - type: common
    common_flags: # flags need to be combined together across all packages
      - flags: -Ofast -flto=auto -ffast-math -funroll-loops
    ldflags: 
      - flags: -flto-partition=none
    cflags:
    asmflags:
    cxxflags:
    prebuild_steps: # could be override by app/bsp type
      command:
      description:
    postbuild_steps: # could be override by app/bsp type
      command:
      description:

## Package Base Information
name: app-nuclei_audio-evs
owner: nuclei
version: 0.1.0
description: EVS (Enhanced Voice Services) Codec
type: app
keywords:
  - evs
  - codec
category: audio application
license: Apache-2.0
homepage: https://github.com/Nuclei-Software/nuclei-audio-library/tree/master/EVS

## Package Dependency
dependencies:
  - name: sdk-nuclei_sdk
    version:

## Package Configurations
configuration:

setconfig:
  - config: stdclib
    value: newlib_small
  - config: download_mode
    value: ddr

## Source Code Management
codemanage:
  copyfiles:
    - path:
      - "*.c"
      - "*.h"
      - "basic_math"
      - "basic_op"
      - "data/*.c"
      - "data/*.h"
      - "lib_com"
      - "lib_dec"
      - "lib_enc"
  incdirs:
    - path: 
      - "./"
      - "basic_math"
      - "basic_op"
      - "lib_com"
      - "lib_dec"
      - "lib_enc"
  libdirs:
  ldlibs:

## Build Configuration
buildconfig:
  - type: common
    common_flags: # flags need to be combined together across all packages
      - flags: -O3
    ldflags:
    cflags:
    asmflags:
    cxxflags:
    prebuild_steps: # could be override by app/bsp type
      command:
      description:
    postbuild_steps: # could be override by app/bsp type
      command:
      description:

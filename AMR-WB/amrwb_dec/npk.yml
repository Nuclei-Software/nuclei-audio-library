## Package Base Information
name: app-nuclei_audio-amrwbdec
owner: nuclei
version: 0.1.0
description: AMR-WB (Adaptive Multi-Rate Wideband) Decoder
type: app
keywords:
  - amr-wb
  - decoder
category: audio application
license: Apache-2.0
homepage: https://github.com/Nuclei-Software/nuclei-audio-library/tree/master/AMR-WB/amrwb_dec

## Package Dependency
dependencies:
  - name: sdk-nuclei_sdk
    version:

# Package Configurations
configuration:

setconfig:
  - config: stdclib
    value: newlib_small
  - config: download_mode
    value: ddr

## Source Code Management
codemanage:
  copyfiles:
    - path:
      - "*.c"
      - "*.cpp"
      - "*.h"
      - "src"
      - "inc"
      - "../data"
  incdirs:
    - path:
      - "./"
      - "src"
      - "inc"
      - "data"
  libdirs:
  ldlibs:

# Build Configuration
buildconfig:
  - type: common
    common_flags: # flags need to be combined together across all packages
      - flags: -O3
    ldflags:
    cflags:
    asmflags:
    cxxflags:
      - flags: -std=c++11
    prebuild_steps: # could be override by app/bsp type
      command:
      description:
    postbuild_steps: # could be override by app/bsp type
      command:
      description:

## Package Base Information
name: app-nulcei_audio-helixmp3dec
owner: nuclei
version: 0.1.0
description: Helix MP3 Decoder
type: app
keywords:
  - mp3
  - decoder
category: audio application
license: GPL-3.0
homepage: https://github.com/Nuclei-Software/nuclei-audio-library/tree/master/MP3/Helix

## Package Dependency
dependencies:
  - name: sdk-nuclei_sdk
    version:

# Package Configurations
configuration:

setconfig:
  - config: stdclib
    value: newlib_small
  - config: download_mode
    value: ddr

## Source Code Management
codemanage:
  copyfiles:
    - path:
      - "*.c"
      - "src"
      - "data/*.c"
      - "data/*.h"
  incdirs:
    - path:
      - "./"
      - "src"
      - "data"
      - "src/libhelix/real"
      - "src/libhelix/pub"
  libdirs:
  ldlibs:

# Build Configuration
buildconfig:
  - type: common
    common_flags: # flags need to be combined together across all packages
      - flags: -O3
    ldflags:
    cflags:
    asmflags:
    cxxflags:
    prebuild_steps: # could be override by app/bsp type
      command:
      description:
    postbuild_steps: # could be override by app/bsp type
      command:
      description:

## Package Base Information
name: app-nuclei_audio-speexdsp
owner: nuclei
version: 0.1.0
description: SpeexDSP Demo including NR, AEC, AGC, etc.
type: app
keywords:
  - speexdsp
category: audio application
license: BSD
homepage: https://github.com/Nuclei-Software/nuclei-audio-library/tree/master/SpeexDSP

## Package Dependency
dependencies:
  - name: sdk-nuclei_sdk
    version:

# Package Configurations
configuration:
  data_type:
    default_value: fixed
    type: choice
    description: Data Type
    choices:
      - name: float
        description: Floating Point
      - name: fixed
        description: Fixed Point

setconfig:
  - config: stdclib
    value: newlib_small
  - config: download_mode
    value: ddr

## Source Code Management
codemanage:
  copyfiles:
    - path:
        - "*.c"
        - "src"
        - "inc"
        - "data/*.c"
        - "data/*.h"
    - path: ["data/fixed/*.h"]
      condition: $(contains(${data_type}, "fixed"))
    - path: ["data/float/*.h"]
      condition: $(contains(${data_type}, "float"))
  incdirs:
    - path:
        - "./"
        - "data"
        - "inc"
    - path: ["data/fixed"]
      condition: $(contains(${data_type}, "fixed"))
    - path: ["data/float"]
      condition: $(contains(${data_type}, "float"))
  libdirs:
  ldlibs:
    - libs: [m]

# Build Configuration
buildconfig:
  - type: common
    cdefines:
      - defines: HAVE_CONFIG_H
      - defines: USE_FIXED_POINT
        condition: $(contains(${data_type}, "fixed"))
      - defines: RISCV_ASM
        condition: $(contains(${data_type}, "fixed"))
    common_flags: # flags need to be combined together across all packages
      - flags: -O3
    ldflags:
    cflags:
    asmflags:
    cxxflags:
    prebuild_steps: # could be override by app/bsp type
      command:
      description:
    postbuild_steps: # could be override by app/bsp type
      command:
      description:

## Package Base Information
name: app-nuclei_audio-lc3plus
owner: nuclei
version: 0.1.0
description: LC3plus (Low Complexity Communication Codec)
type: app
keywords:
  - lc3plus
  - codec
category: audio application
license:
homepage: https://github.com/Nuclei-Software/nuclei-audio-library/tree/master/LC3plus

## Package Dependency
dependencies:
  - name: sdk-nuclei_sdk
    version:

# Package Configurations
configuration:
  data_type:
    default_value: fixed
    type: choice
    description: Data Type
    choices:
      - name: float
        description: Floating Point
      - name: fixed
        description: Fixed Point

setconfig:
  - config: stdclib
    value: newlib_small
  - config: download_mode
    value: ddr

## Source Code Management
codemanage:
  copyfiles:
    - path:
        - "*.c"
        - "data/*.c"
        - "data/*.h"
    - path:
        - "data/fixed/*.h"
        - "fixed_point"
      condition: $(contains(${data_type}, "fixed"))
    - path:
        - "data/float/*.h"
        - "floating_point"
      condition: $(contains(${data_type}, "float"))
  incdirs:
    - path:
        - "./"
        - "data"
    - path:
        - "data/fixed"
        - "fixed_point"
        - "fixed_point/basic_op"
      condition: $(contains(${data_type}, "fixed"))
    - path:
        - "data/float"
        - "floating_point"
        - "floating_point/fft"
      condition: $(contains(${data_type}, "float"))
  libdirs:
  ldlibs:
    - libs: [m]

# Build Configuration
buildconfig:
  - type: common
    cdefines:
      - defines: DISABLE_HR_MODE
        condition: $(contains(${data_type}, "fixed"))
      - defines: WMOPS=0
        condition: $(contains(${data_type}, "fixed"))
      - defines: DONT_COUNT_MEM
        condition: $(contains(${data_type}, "fixed"))
      - defines: FIXED_POINT
        condition: $(contains(${data_type}, "fixed"))
    common_flags: # flags need to be combined together across all packages
      - flags: -O3
    ldflags:
    cflags:
    asmflags:
    cxxflags:
    prebuild_steps: # could be override by app/bsp type
      command:
      description:
    postbuild_steps: # could be override by app/bsp type
      command:
      description:
